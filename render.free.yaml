# V1-C free staging only. This file intentionally has no Worker or Persistent Disk.
services:
  - type: web
    name: xsj-content-web-free-staging
    runtime: node
    plan: free
    repo: https://github.com/lazyyz1/xsj-content-center
    region: singapore
    branch: feat/production-readiness-v1b
    autoDeployTrigger: commit
    # Render Free build machines expose many CPUs; cap Next.js static workers to avoid Free-plan OOM.
    buildCommand: CIRCLE_NODE_TOTAL=2 pnpm install --frozen-lockfile && CIRCLE_NODE_TOTAL=2 pnpm exec turbo build
    # Free services do not support preDeployCommand; migrate deploy is idempotent and runs before start.
    startCommand: pnpm db:migrate && pnpm --filter @content-center/web start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: RENDER_MEDIA_RELAY
      - key: MEDIA_STORAGE_ROOT
        value: /tmp/xsj-media
      - key: APP_URL
        fromService:
          type: web
          name: xsj-content-web-free-staging
          envVarKey: RENDER_EXTERNAL_URL
      - key: MEDIA_RELAY_INTERNAL_BASE_URL
        fromService:
          type: web
          name: xsj-content-web-free-staging
          property: hostport
      - key: MEDIA_RELAY_INTERNAL_SECRET
        generateValue: true
      - key: MEDIA_RELAY_SIGNING_SECRET
        generateValue: true
      - key: ASR_AUDIO_RETENTION_HOURS
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: xsj-content-postgres-free-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: xsj-content-redis-free-staging
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"
      - key: NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP
        value: "false"

  - type: keyvalue
    name: xsj-content-redis-free-staging
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: xsj-content-postgres-free-staging
    plan: free
    region: singapore
    ipAllowList: []
